<style>
/* Layout: a wide 3D stage with a handwritten "profile note" panel beside it; stacks on phones */
:root {
  --bg: #eef2fc;
  --sky-top: #cfe0ff;
  --sky-bottom: #f6f2ff;
  --paper: #ffffff;
  --ink: #3b3f6e;
  --ink-soft: #6c70a3;
  --accent: #6f86e8;
  --accent-ink: #ffffff;
  --line: #d9def5;
  --chip: #eef1ff;
  --font-hand: "Klee One", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
  --font-body: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12142a; --sky-top: #0d1030; --sky-bottom: #2a2b5c;
    --paper: #1c1f3e; --ink: #e6e8ff; --ink-soft: #a5aadb;
    --accent: #8fa2ff; --accent-ink: #12142a; --line: #34386a; --chip: #262a52;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12142a; --sky-top: #0d1030; --sky-bottom: #2a2b5c;
  --paper: #1c1f3e; --ink: #e6e8ff; --ink-soft: #a5aadb;
  --accent: #8fa2ff; --accent-ink: #12142a; --line: #34386a; --chip: #262a52;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px;
}
.wrap { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; height: 100%; min-height: 560px; max-width: 1280px; margin: 0 auto; }
.stage {
  position: relative; min-width: 0; border-radius: 20px; overflow: hidden;
  background: linear-gradient(180deg, var(--sky-top), var(--sky-bottom));
}
.stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.stage .sign { position: absolute; right: 18px; bottom: 12px; font-family: var(--font-hand); font-size: 34px; color: var(--accent); opacity: .85; pointer-events: none; }
.stage .hint { position: absolute; left: 16px; bottom: 14px; font-size: 12px; color: var(--ink-soft); pointer-events: none; }
.stage .bubble {
  position: absolute; left: 18px; top: 16px; font-family: var(--font-hand); font-size: 20px; line-height: 1.4;
  color: var(--ink); background: color-mix(in srgb, var(--paper) 78%, transparent); padding: 8px 14px; border-radius: 14px;
  max-width: 70%;
}
.panel { min-width: 0; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; }
.note { background: var(--paper); border-radius: 16px; padding: 18px 20px; border: 1px solid var(--line); }
.note h1 { font-family: var(--font-hand); font-weight: 600; font-size: 24px; margin: 0 0 10px; text-wrap: balance; }
.note h1 span { color: var(--accent); }
dl { display: grid; grid-template-columns: 3.2em 1fr; gap: 4px 10px; margin: 0; font-family: var(--font-hand); font-size: 15px; }
dt { color: var(--ink-soft); }
dd { margin: 0; }
.ctrl { display: flex; flex-direction: column; gap: 6px; }
.ctrl .label { font-size: 12px; letter-spacing: .08em; color: var(--ink-soft); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button {
  font: inherit; font-size: 14px; border: 1px solid var(--line); background: var(--chip); color: var(--ink);
  padding: 6px 12px; border-radius: 999px; cursor: pointer;
}
.chips button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chips button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.foot { font-size: 12px; color: var(--ink-soft); line-height: 1.6; }
@media (max-width: 820px) {
  html, body { height: auto; }
  .wrap { grid-template-columns: 1fr; height: auto; }
  .stage { height: 72vh; min-height: 420px; }
}
</style>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
stage.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(28, 1, 0.1, 100);
camera.position.set(1.6, 3.0, 10.5);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.35, 0);
controls.enableDamping = true;
controls.minDistance = 3.5; controls.maxDistance = 18;
controls.autoRotate = true; controls.autoRotateSpeed = 0.9;

scene.add(new THREE.HemisphereLight(0xe6ecff, 0xf3e3ec, 1.15));
const key = new THREE.DirectionalLight(0xfffaf5, 1.5); key.position.set(-3, 6, 6); scene.add(key);
const rim = new THREE.DirectionalLight(0xa9bcff, 1.1); rim.position.set(4, 3, -5); scene.add(rim);

// ---------- materials ----------
const grad = new THREE.DataTexture(new Uint8Array([120, 120, 120, 255, 200, 200, 200, 255, 255, 255, 255, 255]), 3, 1);
grad.minFilter = grad.magFilter = THREE.NearestFilter; grad.needsUpdate = true;
const toon = (color, extra = {}) => new THREE.MeshToonMaterial({ color, gradientMap: grad, ...extra });
const gradSkin = new THREE.DataTexture(new Uint8Array([225, 225, 225, 255, 255, 255, 255, 255]), 2, 1);
gradSkin.minFilter = gradSkin.magFilter = THREE.NearestFilter; gradSkin.needsUpdate = true;

function knitTexture() {
  const c = document.createElement('canvas'); c.width = 64; c.height = 64;
  const g = c.getContext('2d');
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, 64, 64);
  for (let x = 0; x < 64; x += 8) {
    const lg = g.createLinearGradient(x, 0, x + 8, 0);
    lg.addColorStop(0, '#e6e6ee'); lg.addColorStop(.5, '#ffffff'); lg.addColorStop(1, '#e6e6ee');
    g.fillStyle = lg; g.fillRect(x, 0, 8, 64);
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}
const knit = knitTexture();

const M = {
  skin: toon(0xffe9e0, { gradientMap: gradSkin }),
  hair: toon(0xffffff, { vertexColors: true, side: THREE.DoubleSide }),
  hairCap: toon(0xeceef8, { side: THREE.DoubleSide }),
  sweater: toon(0xfbfaf7, { map: knit, side: THREE.DoubleSide }),
  cami: toon(0xbcd0ff),
  lace: toon(0xffffff),
  ribbon: toon(0x5f7fe6, { side: THREE.DoubleSide }),
  skirt: toon(0x3d4678, { side: THREE.DoubleSide }),
  sock: toon(0xffffff),
  shoe: toon(0xb9cbf7),
  petal: toon(0xf7f7ff),
  petalBlue: toon(0xcfdcff),
  gold: toon(0xffd98a),
  pin: toon(0xf2f4ff),
  dark: toon(0x2e3150),
  pink: toon(0xffc4d2),
};
const OUT = { skin: 0xc8958a, hair: 0x9ea4cc, cloth: 0x9298bd, dark: 0x1b1c30 };

const outlineMats = new Map();
function outlineMat(color, w) {
  const k = color + ':' + w;
  if (!outlineMats.has(k)) {
    const m = new THREE.MeshBasicMaterial({ color, side: THREE.BackSide });
    m.onBeforeCompile = s => {
      s.vertexShader = s.vertexShader.replace('#include <begin_vertex>', `vec3 transformed = position + normal * ${w.toFixed(4)};`);
    };
    outlineMats.set(k, m);
  }
  return outlineMats.get(k);
}
function mesh(geo, mat, outline = OUT.cloth, w = 0.012) {
  const m = new THREE.Mesh(geo, mat);
  if (outline !== null) {
    const o = new THREE.Mesh(geo, outlineMat(outline, w));
    o.userData.outline = true; m.add(o);
  }
  return m;
}

// ---------- geometry helpers ----------
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const lerp = (a, b, t) => a + (b - a) * t;

// Tapered, flattened ribbon-tube along a curve. hint(p) gives the "outward" direction the flat side faces.
function strandGeo(pts, w0, t0, hint, opts = {}) {
  const { segs = 28, radial = 8, taper = u => Math.max(0.03, Math.pow(1 - u, 0.85)) * Math.min(1, 0.75 + u * 4),
          c0 = new THREE.Color(0xf3f4fb), c1 = new THREE.Color(0xcdd8f6) } = opts;
  const curve = new THREE.CatmullRomCurve3(pts);
  const pos = [], col = [], idx = [];
  const S = new THREE.Vector3(), F = new THREE.Vector3(), c = new THREE.Color();
  for (let i = 0; i <= segs; i++) {
    const u = i / segs, p = curve.getPointAt(u), T = curve.getTangentAt(u);
    const N = hint(p).normalize();
    S.crossVectors(T, N).normalize(); F.crossVectors(S, T).normalize();
    const k = taper(u), w = w0 * k, th = Math.max(0.004, t0 * k);
    c.copy(c0).lerp(c1, Math.pow(u, 1.6));
    for (let j = 0; j < radial; j++) {
      const a = j / radial * Math.PI * 2;
      pos.push(p.x + S.x * Math.cos(a) * w + F.x * Math.sin(a) * th,
               p.y + S.y * Math.cos(a) * w + F.y * Math.sin(a) * th,
               p.z + S.z * Math.cos(a) * w + F.z * Math.sin(a) * th);
      col.push(c.r, c.g, c.b);
    }
  }
  for (let i = 0; i < segs; i++) for (let j = 0; j < radial; j++) {
    const a = i * radial + j, b = i * radial + (j + 1) % radial, cc = a + radial, d = b + radial;
    idx.push(a, cc, b, b, cc, d);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setIndex(idx); g.computeVertexNormals();
  return g;
}

function lathe(profile, segs = 48) {
  return new THREE.LatheGeometry(profile.map(([r, y]) => new THREE.Vector2(r, y)), segs);
}

// ---------- character ----------
const rin = new THREE.Group(); scene.add(rin);
const R = 0.62;                       // head radius
const HEAD_Y = 3.36;

// ground shadow
{
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'); const rg = g.createRadialGradient(64, 64, 4, 64, 64, 64);
  rg.addColorStop(0, 'rgba(60,70,140,0.35)'); rg.addColorStop(1, 'rgba(60,70,140,0)');
  g.fillStyle = rg; g.fillRect(0, 0, 128, 128);
  const sh = new THREE.Mesh(new THREE.PlaneGeometry(2.4, 1.6), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false }));
  sh.rotation.x = -Math.PI / 2; sh.position.y = 0.005; sh.userData.fx = true; rin.add(sh);
}

// legs, socks, shoes
for (const s of [-1, 1]) {
  const leg = mesh(lathe([[0.001, 0.0], [0.07, 0.02], [0.075, 0.4], [0.1, 0.9], [0.125, 1.35], [0.13, 1.6], [0.001, 1.62]], 24), M.skin, OUT.skin, 0.008);
  leg.position.set(s * 0.16, 0.1, 0); rin.add(leg);
  const sock = mesh(lathe([[0.001, 0], [0.085, 0.02], [0.088, 0.5], [0.095, 0.58], [0.001, 0.6]], 24), M.sock, OUT.cloth, 0.008);
  sock.position.set(s * 0.16, 0.08, 0); rin.add(sock);
  const band = mesh(new THREE.TorusGeometry(0.094, 0.014, 8, 24), M.ribbon, null);
  band.rotation.x = Math.PI / 2; band.position.set(s * 0.16, 0.6, 0); rin.add(band);
  const shoe = mesh(new THREE.SphereGeometry(1, 24, 16), M.shoe, OUT.cloth, 0.01);
  shoe.scale.set(0.11, 0.08, 0.17); shoe.position.set(s * 0.16, 0.07, 0.05); rin.add(shoe);
}

// skirt (pleated)
{
  const g = new THREE.CylinderGeometry(0.42, 0.8, 0.62, 64, 6, true);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), z = p.getZ(i), y = p.getY(i);
    const a = Math.atan2(z, x), t = (0.31 - y) / 0.62;
    const pleat = 1 + 0.06 * t * Math.abs(((a / (Math.PI * 2) * 16) % 1 + 1) % 1 - 0.5) * 2;
    p.setX(i, x * pleat); p.setZ(i, z * pleat);
  }
  g.computeVertexNormals();
  const skirt = mesh(g, M.skirt, OUT.dark, 0.01); skirt.position.y = 1.62; rin.add(skirt);
  const hem = mesh(new THREE.TorusGeometry(0.83, 0.025, 8, 64), M.lace, null);
  hem.rotation.x = Math.PI / 2; hem.position.y = 1.32; rin.add(hem);
}

// torso: camisole + skin shoulders + oversized sweater
const torso = new THREE.Group(); rin.add(torso);
{
  const body = mesh(lathe([[0.001, 1.75], [0.36, 1.78], [0.37, 2.2], [0.36, 2.5], [0.26, 2.68], [0.001, 2.72]], 32), M.skin, OUT.skin, 0.008);
  body.scale.z = 0.78; torso.add(body);
  for (const s of [-1, 1]) {
    const sh = mesh(new THREE.SphereGeometry(0.16, 20, 14), M.skin, OUT.skin, 0.008);
    sh.position.set(s * 0.42, 2.5, 0); sh.scale.set(1.1, 0.9, 1); torso.add(sh);
    const strap = mesh(new THREE.BoxGeometry(0.035, 0.36, 0.02), M.ribbon, null);
    strap.position.set(s * 0.2, 2.47, 0.22); strap.rotation.set(-0.35, 0, -s * 0.12); torso.add(strap);
  }
  const cami = mesh(lathe([[0.37, 1.85], [0.385, 2.15], [0.375, 2.36], [0.33, 2.42]], 40), M.cami, OUT.cloth, 0.006);
  cami.scale.z = 0.8; torso.add(cami);
  const camiTrim = mesh(new THREE.TorusGeometry(0.335, 0.018, 8, 40), M.lace, null);
  camiTrim.rotation.x = Math.PI / 2; camiTrim.scale.y = 0.8; camiTrim.position.y = 2.42; torso.add(camiTrim);
  // little chest bow
  const bow = new THREE.Group(); bow.position.set(0, 2.36, 0.29); torso.add(bow);
  for (const s of [-1, 1]) {
    const loop = mesh(new THREE.SphereGeometry(0.06, 14, 10), M.ribbon, OUT.dark, 0.006);
    loop.scale.set(1.2, 0.7, 0.4); loop.position.x = s * 0.065; loop.rotation.z = s * 0.3; bow.add(loop);
  }
  bow.add(mesh(new THREE.SphereGeometry(0.03, 10, 8), M.ribbon, OUT.dark, 0.006));

  // sweater: wide off-shoulder neckline, slouchy body, ribbed hem
  const sweater = mesh(lathe([[0.5, 1.68], [0.6, 1.72], [0.62, 1.82], [0.6, 2.05], [0.56, 2.25], [0.52, 2.38], [0.48, 2.42]], 64), M.sweater, OUT.cloth, 0.01);
  sweater.scale.z = 0.86; torso.add(sweater);
  M.sweater.map.repeat.set(20, 3);
  const rib = new THREE.CylinderGeometry(0.6, 0.58, 0.12, 64, 1, true);
  const rp = rib.attributes.position;
  for (let i = 0; i < rp.count; i++) { const a = Math.atan2(rp.getZ(i), rp.getX(i)), k = 1 + 0.02 * Math.cos(a * 48); rp.setX(i, rp.getX(i) * k); rp.setZ(i, rp.getZ(i) * k); }
  rib.computeVertexNormals();
  const hemRib = mesh(rib, M.sweater, OUT.cloth, 0.008); hemRib.scale.z = 0.86; hemRib.position.y = 1.66; torso.add(hemRib);
}

// arms (shoulder -> upper sleeve -> elbow -> forearm sleeve -> knit cuff -> sleeve-paw hand)
const arms = {};
function sleeveGeo(r0, r1, len) {
  return lathe([[0.001, 0], [r0 * 0.8, -0.03], [r0, -0.1], [lerp(r0, r1, .5) * 1.05, -len * 0.5], [r1, -len], [r1 * 0.95, -len - 0.02]], 32);
}
for (const s of [-1, 1]) {
  const shoulder = new THREE.Group(); shoulder.position.set(s * 0.5, 2.46, 0); torso.add(shoulder);
  const upper = mesh(sleeveGeo(0.17, 0.2, 0.5), M.sweater, OUT.cloth, 0.009); shoulder.add(upper);
  const elbow = new THREE.Group(); elbow.position.y = -0.48; shoulder.add(elbow);
  elbow.add(mesh(new THREE.SphereGeometry(0.2, 20, 14), M.sweater, OUT.cloth, 0.009));
  const fore = mesh(sleeveGeo(0.2, 0.23, 0.42), M.sweater, OUT.cloth, 0.009); elbow.add(fore);
  const cg = new THREE.CylinderGeometry(0.2, 0.17, 0.12, 40, 1, true);
  const cp = cg.attributes.position;
  for (let i = 0; i < cp.count; i++) { const a = Math.atan2(cp.getZ(i), cp.getX(i)), k = 1 + 0.04 * Math.cos(a * 20); cp.setX(i, cp.getX(i) * k); cp.setZ(i, cp.getZ(i) * k); }
  cg.computeVertexNormals();
  const cuff = mesh(cg, M.sweater, OUT.cloth, 0.008); cuff.position.y = -0.48; elbow.add(cuff);
  const hand = new THREE.Group(); hand.position.y = -0.56; elbow.add(hand);
  const fist = mesh(new THREE.SphereGeometry(0.1, 20, 14), M.skin, OUT.skin, 0.007); fist.scale.set(0.9, 0.85, 1); hand.add(fist);
  const thumb = mesh(new THREE.SphereGeometry(0.04, 12, 8), M.skin, OUT.skin, 0.006); thumb.position.set(-s * 0.06, 0.02, 0.06); hand.add(thumb);
  arms[s] = { shoulder, elbow, hand };
}

// neck + head
const neck = mesh(new THREE.CylinderGeometry(0.1, 0.12, 0.42, 20), M.skin, OUT.skin, 0.006);
neck.position.y = 2.82; torso.add(neck);
const headPivot = new THREE.Group(); headPivot.position.y = 2.95; torso.add(headPivot);
const head = new THREE.Group(); head.position.y = HEAD_Y - 2.95; headPivot.add(head);
const HS = V(1, 0.97, 0.93);           // head scale

function deformHead(g, r) {
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const y = p.getY(i);
    if (y < 0) {
      const k = Math.pow(-y / r, 1.7);
      p.setX(i, p.getX(i) * (1 - 0.3 * k));
      p.setZ(i, p.getZ(i) * (1 - 0.08 * k) + 0.04 * k);
    }
  }
  g.computeVertexNormals(); return g;
}
const skull = mesh(deformHead(new THREE.SphereGeometry(R, 64, 48), R), M.skin, OUT.skin, 0.01);
skull.scale.copy(HS); head.add(skull);
for (const s of [-1, 1]) {
  const ear = mesh(new THREE.SphereGeometry(0.08, 12, 10), M.skin, OUT.skin, 0.006);
  ear.scale.set(0.5, 1, 0.8); ear.position.set(s * 0.6, -0.05, -0.02); head.add(ear);
}

// face: transparent canvas painted onto a slice of a sphere just above the skin
const PHI_W = 1.9, TH0 = 1.0, TH1 = 2.3;
const faceCanvas = document.createElement('canvas');
faceCanvas.width = Math.round(1024 * PHI_W / (TH1 - TH0)); faceCanvas.height = 1024;
const faceTex = new THREE.CanvasTexture(faceCanvas);
faceTex.colorSpace = THREE.SRGBColorSpace; faceTex.anisotropy = 4;
const faceMat = new THREE.MeshToonMaterial({ map: faceTex, gradientMap: gradSkin, transparent: true, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2 });
const faceGeo = deformHead(new THREE.SphereGeometry(R * 1.004, 96, 64, Math.PI / 2 - PHI_W / 2, PHI_W, TH0, TH1 - TH0), R * 1.004);
const face = new THREE.Mesh(faceGeo, faceMat); face.scale.copy(HS); face.renderOrder = 2; head.add(face);

const PX = faceCanvas.height / (TH1 - TH0);   // pixels per radian
const fx = az => faceCanvas.width / 2 + az * PX;
const fy = y => (Math.acos(THREE.MathUtils.clamp(y / R, -1, 1)) - TH0) * PX;

function drawEye(g, cx, cy, s, mode) {
  const w = 160, h = 190;
  g.save(); g.translate(cx, cy);
  g.lineCap = 'round'; g.lineJoin = 'round';
  if (mode === 'closed') {
    g.strokeStyle = '#3b3552'; g.lineWidth = 16;
    g.beginPath(); g.moveTo(-w, 10); g.quadraticCurveTo(0, -70, w, 10); g.stroke();
    g.lineWidth = 8; g.beginPath(); g.moveTo(s * w * 0.9, 0); g.lineTo(s * (w + 26), -14); g.stroke();
    g.restore(); return;
  }
  const lid = mode === 'soft' ? 0.32 : 0;
  g.beginPath(); g.ellipse(0, 6, w, h, 0, 0, Math.PI * 2); g.clip();
  g.fillStyle = '#ffffff'; g.fillRect(-w, -h, w * 2, h * 2 + 20);
  const ig = g.createLinearGradient(0, -h, 0, h);
  ig.addColorStop(0, '#262a63'); ig.addColorStop(0.35, '#4a4fb3'); ig.addColorStop(0.7, '#7d8ef0'); ig.addColorStop(1, '#c4d6ff');
  g.fillStyle = ig; g.beginPath(); g.ellipse(0, 14, w * 0.86, h * 0.98, 0, 0, Math.PI * 2); g.fill();
  g.strokeStyle = 'rgba(40,40,100,.55)'; g.lineWidth = 5; g.stroke();
  g.fillStyle = '#1d1f4a'; g.beginPath(); g.ellipse(0, 2, w * 0.42, h * 0.5, 0, 0, Math.PI * 2); g.fill();
  // sparkly ring inside the iris
  g.strokeStyle = 'rgba(190,210,255,.6)'; g.lineWidth = 4;
  g.beginPath(); g.ellipse(0, 26, w * 0.6, h * 0.62, 0, 0.15 * Math.PI, 0.85 * Math.PI); g.stroke();
  g.fillStyle = '#ffffff';
  g.beginPath(); g.ellipse(-s * 30, -40, 32, 38, 0, 0, Math.PI * 2); g.fill();
  g.beginPath(); g.ellipse(s * 36, 58, 13, 15, 0, 0, Math.PI * 2); g.fill();
  g.beginPath(); g.ellipse(s * 2, 20, 7, 7, 0, 0, Math.PI * 2); g.fill();
  if (lid) { g.fillStyle = '#ffe6dc'; g.fillRect(-w, -h - 10, w * 2, h * 2 * lid + 10); }
  g.restore();
  // lashes
  g.save(); g.translate(cx, cy); g.lineCap = 'round';
  const top = -h + 6 + (lid ? h * 2 * lid - 6 : 0);
  g.strokeStyle = '#3b3552'; g.lineWidth = 20;
  g.beginPath(); g.moveTo(-w - 8, top + 46); g.quadraticCurveTo(0, top - 30, w + 8, top + 46); g.stroke();
  g.lineWidth = 10; g.beginPath(); g.moveTo(s * (w + 2), top + 40); g.lineTo(s * (w + 34), top + 14); g.stroke();
  g.lineWidth = 6; g.strokeStyle = 'rgba(80,70,110,.55)';
  g.beginPath(); g.moveTo(-w * 0.55, h + 18); g.quadraticCurveTo(0, h + 26, w * 0.55, h + 18); g.stroke();
  g.restore();
}

function drawFace(expr, blink = false) {
  const g = faceCanvas.getContext('2d');
  g.clearRect(0, 0, faceCanvas.width, faceCanvas.height);
  const eyeY = fy(-0.1), eyeDX = 0.43 * PX;
  // blush
  for (const s of [-1, 1]) {
    const bx = fx(s * 0.5), by = fy(-0.24);
    const rg = g.createRadialGradient(bx, by, 4, bx, by, 110);
    rg.addColorStop(0, 'rgba(255,130,155,.7)'); rg.addColorStop(1, 'rgba(255,140,160,0)');
    g.fillStyle = rg; g.beginPath(); g.ellipse(bx, by, 120, 70, 0, 0, Math.PI * 2); g.fill();
    g.strokeStyle = 'rgba(240,110,130,.55)'; g.lineWidth = 5; g.lineCap = 'round';
    for (let k = -1; k <= 1; k++) { g.beginPath(); g.moveTo(bx + k * 26 + 10, by - 16); g.lineTo(bx + k * 26 - 10, by + 16); g.stroke(); }
  }
  // brows (mostly under the bangs)
  g.strokeStyle = 'rgba(150,140,180,.8)'; g.lineWidth = 8; g.lineCap = 'round';
  for (const s of [-1, 1]) { const bx = fx(s * eyeDX / PX); g.beginPath(); g.moveTo(bx - 60, fy(0.17)); g.quadraticCurveTo(bx, fy(0.2), bx + 60, fy(0.17)); g.stroke(); }
  // eyes (s=+1 is the character's left = viewer's right)
  for (const s of [-1, 1]) {
    let mode = expr === 'soft' ? 'soft' : 'open';
    if (blink || (expr === 'wink' && s === 1) || expr === 'cat') mode = 'closed';
    if (expr === 'cat' && s === -1) mode = 'open';
    drawEye(g, fx(0) + s * eyeDX, eyeY, s, mode);
  }
  // nose
  g.fillStyle = 'rgba(220,150,150,.7)'; g.beginPath(); g.ellipse(fx(0), fy(-0.27), 6, 4, 0, 0, Math.PI * 2); g.fill();
  // mouth
  const mx = fx(0), my = fy(-0.38);
  g.save(); g.translate(mx, my); g.scale(1.75, 1.75); g.translate(-mx, -my);
  g.lineCap = 'round'; g.lineJoin = 'round';
  if (expr === 'soft') {
    g.strokeStyle = '#a45763'; g.lineWidth = 7;
    g.beginPath(); g.moveTo(mx - 34, my - 6); g.quadraticCurveTo(mx, my + 16, mx + 34, my - 6); g.stroke();
  } else if (expr === 'cat') {
    g.strokeStyle = '#a45763'; g.lineWidth = 7; g.fillStyle = '#c4505e';
    g.beginPath(); g.moveTo(mx - 50, my - 14); g.quadraticCurveTo(mx, my - 22, mx + 50, my - 14); g.quadraticCurveTo(mx, my + 64, mx - 50, my - 14); g.fill(); g.stroke();
    g.fillStyle = '#ffffff'; g.beginPath(); g.moveTo(mx - 30, my - 17); g.lineTo(mx - 22, my - 2); g.lineTo(mx - 14, my - 18); g.fill();
    g.fillStyle = '#f2909e'; g.beginPath(); g.ellipse(mx, my + 20, 26, 14, 0, 0, Math.PI * 2); g.fill();
  } else {
    g.fillStyle = '#b8434f'; g.strokeStyle = '#8c3743'; g.lineWidth = 6;
    g.beginPath(); g.moveTo(mx - 58, my - 18); g.quadraticCurveTo(mx, my - 26, mx + 58, my - 18); g.quadraticCurveTo(mx + 40, my + 66, mx, my + 70); g.quadraticCurveTo(mx - 40, my + 66, mx - 58, my - 18); g.fill(); g.stroke();
    g.save(); g.clip();
    g.fillStyle = '#f48a99'; g.beginPath(); g.ellipse(mx, my + 64, 46, 30, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#ffffff'; g.fillRect(mx - 60, my - 30, 120, 20);
    g.restore();
  }
  g.restore();
  faceTex.needsUpdate = true;
}

// ---------- hair ----------
const hair = new THREE.Group(); head.add(hair);
const HC = V(0, 0, 0);
const radial = p => p.clone().sub(HC);
const horiz = p => V(p.x, 0.0001, p.z);
const onHead = (az, th, r) => V(Math.sin(az) * Math.sin(th) * r * HS.x, Math.cos(th) * r * HS.y, Math.cos(az) * Math.sin(th) * r * HS.z);

// cap: top dome + back shell with a front opening for the face
hair.add(mesh(new THREE.SphereGeometry(R * 1.06, 48, 24, 0, Math.PI * 2, 0, 1.15), M.hairCap, OUT.hair, 0.01));
{
  const open = 1.35;
  const back = mesh(new THREE.SphereGeometry(R * 1.06, 48, 32, Math.PI / 2 + open, Math.PI * 2 - open * 2, 1.1, Math.PI - 1.1), M.hairCap, OUT.hair, 0.01);
  hair.add(back);
}
for (const m of hair.children) m.scale.copy(HS).multiplyScalar(1.0);

let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

// bangs
for (let i = 0; i < 11; i++) {
  const az = lerp(-1.15, 1.15, i / 10) + (rnd() - 0.5) * 0.05;
  const end = 1.43 + 0.26 * Math.pow(Math.abs(az), 1.4) + (rnd() - 0.5) * 0.08;
  const sweep = (i % 2 ? 1 : -1) * 0.06 - az * 0.05;
  const pts = [];
  for (let k = 0; k <= 6; k++) {
    const t = k / 6;
    const r = R * (1.075 + 0.03 * Math.sin(t * Math.PI) - (k === 6 ? 0.025 : 0));
    pts.push(onHead(az + sweep * t, lerp(0.2, end, t), r));
  }
  hair.add(mesh(strandGeo(pts, 0.11 + rnd() * 0.03, 0.035, radial), M.hair, OUT.hair, 0.006));
}
// ahoge
hair.add(mesh(strandGeo([onHead(0.2, 0.15, R * 1.05), V(0.05, R * 1.15, 0.1), V(0.14, R * 1.28, 0.02), V(0.18, R * 1.22, -0.08)], 0.03, 0.012, () => V(0, 0, 1)), M.hair, OUT.hair, 0.004));
// side locks
for (const s of [-1, 1]) for (const [az, len, w] of [[1.12, 1.25, 0.12], [1.38, 1.4, 0.14]]) {
  const a = s * az;
  const pts = [onHead(a, 0.75, R * 1.07), onHead(a, 1.4, R * 1.1), onHead(a * 0.96, 1.85, R * 1.05)];
  const p2 = pts[2];
  pts.push(V(p2.x * 1.05, -0.5, p2.z + 0.06), V(p2.x * 1.12, -len * 0.75, p2.z + 0.1), V(p2.x * 1.08 + s * 0.04, -len, p2.z + 0.05));
  hair.add(mesh(strandGeo(pts, w, 0.045, horiz), M.hair, OUT.hair, 0.006));
}
// long back hair down to the waist
for (let i = 0; i < 17; i++) {
  const az = lerp(1.6, Math.PI * 2 - 1.6, i / 16) + (rnd() - 0.5) * 0.06;
  const sx = Math.sin(az), cz = Math.cos(az);
  const len = 1.65 + Math.abs(Math.sin(az)) * -0.15 + (rnd() - 0.5) * 0.15;
  const pts = [
    onHead(az, 0.55, R * 1.05),
    onHead(az, 1.25, R * 1.1),
    V(sx * 0.7, -0.45, cz * 0.74),
    V(sx * 0.74, -0.85, cz * 0.82 - 0.05),
    V(sx * 0.72, -1.3, cz * 0.8 - 0.1),
    V(sx * 0.66 + (rnd() - .5) * 0.06, -0.1 - len, cz * 0.72 - 0.12),
  ];
  hair.add(mesh(strandGeo(pts, 0.19, 0.06, horiz, { segs: 36 }), M.hair, OUT.hair, 0.007));
}

// ---------- accessories ----------
function flower(size, petalMat, petals = 5) {
  const f = new THREE.Group();
  for (let i = 0; i < petals; i++) {
    const a = i / petals * Math.PI * 2;
    const p = mesh(new THREE.SphereGeometry(1, 16, 10), petalMat, OUT.hair, 0.004 / size);
    p.scale.set(size * 0.62, size * 0.38, size * 0.14);
    p.position.set(Math.cos(a) * size * 0.55, Math.sin(a) * size * 0.55, 0); p.rotation.z = a;
    f.add(p);
  }
  const c = mesh(new THREE.SphereGeometry(size * 0.22, 12, 10), M.gold, null); c.position.z = size * 0.08; f.add(c);
  return f;
}
const acc = {};
acc.flower = new THREE.Group(); head.add(acc.flower);
{
  const big = flower(0.27, M.petal, 5);
  const inner = flower(0.15, M.petalBlue, 5); inner.position.z = 0.03; inner.rotation.z = 0.6; big.add(inner);
  big.position.copy(onHead(1.05, 0.95, R * 1.12)); big.lookAt(big.position.clone().multiplyScalar(2).add(V(0, 0.2, 0.6)));
  acc.flower.add(big);
  // ribbon tails under the flower
  for (const k of [0, 1]) {
    const o = big.position;
    const pts = [o.clone().add(V(0, -0.08, 0)), o.clone().add(V(0.05 + k * 0.04, -0.3, 0.02)), o.clone().add(V(0.02 + k * 0.08, -0.55, -0.02)), o.clone().add(V(0.07 + k * 0.06, -0.78, -0.03))];
    acc.flower.add(mesh(strandGeo(pts, 0.045, 0.008, horiz, { c0: new THREE.Color(0x7d98ee), c1: new THREE.Color(0x5b74d6), taper: u => 1 - u * 0.3 }), M.hair, OUT.dark, 0.004));
  }
  const small = flower(0.075, M.petal, 5);
  small.position.copy(onHead(0.62, 0.75, R * 1.1)); small.lookAt(small.position.clone().multiplyScalar(2).add(V(0, 0.3, 0.5)));
  acc.flower.add(small);
}
// hair pins (always on)
for (const [k, rot] of [[0, -0.5], [1, -0.85]]) {
  const pin = mesh(new THREE.BoxGeometry(0.03, 0.2, 0.02), M.pin, OUT.hair, 0.004);
  pin.position.copy(onHead(0.85 + k * 0.08, 1.22 + k * 0.03, R * 1.11)); pin.lookAt(pin.position.clone().multiplyScalar(2)); pin.rotateZ(rot);
  head.add(pin);
}
// cat ears
acc.catears = new THREE.Group(); acc.catears.visible = false; head.add(acc.catears);
for (const s of [-1, 1]) {
  const e = new THREE.Group(); e.position.copy(onHead(s * 0.85, 0.55, R * 1.02)); e.rotation.set(-0.15, 0, -s * 0.5);
  const outer = mesh(new THREE.ConeGeometry(0.17, 0.32, 4, 1), M.hairCap, OUT.hair, 0.008); outer.scale.z = 0.45; outer.position.y = 0.12; e.add(outer);
  const inn = mesh(new THREE.ConeGeometry(0.1, 0.22, 4, 1), M.pink, null); inn.scale.z = 0.3; inn.position.set(0, 0.1, 0.045); e.add(inn);
  acc.catears.add(e);
}
// headphones
acc.phones = new THREE.Group(); acc.phones.visible = false; head.add(acc.phones);
{
  const band = mesh(new THREE.TorusGeometry(R * 1.12, 0.035, 10, 48, Math.PI), M.dark, OUT.dark, 0.005);
  band.position.y = 0.02; band.rotation.y = 0; acc.phones.add(band);
  for (const s of [-1, 1]) {
    const cup = mesh(new THREE.CylinderGeometry(0.17, 0.17, 0.1, 28), M.dark, OUT.dark, 0.006);
    cup.rotation.z = Math.PI / 2; cup.position.set(s * R * 1.12, 0, 0); acc.phones.add(cup);
    const pad = mesh(new THREE.TorusGeometry(0.12, 0.03, 8, 24), M.cami, null);
    pad.rotation.y = Math.PI / 2; pad.position.set(s * (R * 1.12 + 0.055), 0, 0); acc.phones.add(pad);
  }
}

// ---------- sparkles ----------
const sparkles = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'); const rg = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  rg.addColorStop(0, 'rgba(255,255,255,1)'); rg.addColorStop(0.3, 'rgba(210,225,255,.8)'); rg.addColorStop(1, 'rgba(210,225,255,0)');
  g.fillStyle = rg; g.fillRect(0, 0, 64, 64);
  const n = 90, pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { pos[i * 3] = (Math.random() - .5) * 6; pos[i * 3 + 1] = Math.random() * 5.5; pos[i * 3 + 2] = (Math.random() - .5) * 6; }
  const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const p = new THREE.Points(geo, new THREE.PointsMaterial({ size: 0.12, map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
  p.userData.fx = true; scene.add(p); return p;
})();

// ---------- poses (2-bone fit by a small search) ----------
const poseDefs = {
  stand: { 1: { sx: 0.05, sz: 0.2, ex: -0.25 }, [-1]: { sx: 0.05, sz: -0.2, ex: -0.25 }, tilt: 0.0, line: 'ずっと一緒にいようね♡' },
  cheek: { target: s => V(s * 0.36, HEAD_Y - 0.36, 0.5), tilt: 0.12, line: 'ずっと一緒にいようね♡' },
  reach: { 1: { sx: 0.1, sz: 0.25, ex: -0.3 }, target: s => s === -1 ? V(-0.25, 2.75, 1.35) : null, tilt: -0.08, line: '一緒にたくさんの景色を見に行こっ！' },
};
function solveArm(s, target) {
  const a = arms[s], tw = new THREE.Vector3();
  let best = null;
  const evalPose = (sx, sz, ex) => {
    a.shoulder.rotation.set(sx, 0, sz); a.elbow.rotation.set(ex, 0, 0);
    torso.updateMatrixWorld(true); a.hand.getWorldPosition(tw);
    return tw.distanceTo(target) + 0.02 * Math.abs(sz);
  };
  rin.updateMatrixWorld(true);
  for (let sx = -2.6; sx <= 0.4; sx += 0.1) for (let sz = -1.2; sz <= 1.2; sz += 0.1) for (let ex = -2.7; ex <= 0; ex += 0.1) {
    const d = evalPose(sx, sz, ex); if (!best || d < best.d) best = { d, sx, sz, ex };
  }
  for (let step = 0.05; step > 0.005; step /= 2) for (const k of ['sx', 'sz', 'ex']) for (const dir of [-1, 1]) {
    const c = { ...best }; c[k] += dir * step; const d = evalPose(c.sx, c.sz, c.ex); if (d < best.d) best = { ...c, d };
  }
  return best;
}
const poseCache = {};
function poseAngles(name) {
  if (poseCache[name]) return poseCache[name];
  const def = poseDefs[name], out = {};
  const saved = [1, -1].map(s => [arms[s].shoulder.rotation.clone(), arms[s].elbow.rotation.clone()]);
  const tilt = headPivot.rotation.z; headPivot.rotation.z = 0;
  for (const s of [1, -1]) {
    const t = def.target && def.target(s);
    out[s] = t ? solveArm(s, t) : (def[s] || poseDefs.stand[s]);
  }
  [1, -1].forEach((s, i) => { arms[s].shoulder.rotation.copy(saved[i][0]); arms[s].elbow.rotation.copy(saved[i][1]); });
  headPivot.rotation.z = tilt;
  out.tilt = def.tilt; out.line = def.line;
  return poseCache[name] = out;
}

// ---------- state + UI ----------
const state = { pose: 'cheek', face: 'smile', spin: true };
let goal = poseAngles('cheek');
for (const s of [1, -1]) { arms[s].shoulder.rotation.set(goal[s].sx, 0, goal[s].sz); arms[s].elbow.rotation.set(goal[s].ex, 0, 0); }
drawFace(state.face);

const bubble = document.getElementById('bubble');
const lines = { smile: null, wink: '一緒にたくさんの景色を見に行こっ！', soft: 'ねぇ…ずっといてくれる？♡', cat: 'にゃっ♡' };
document.querySelectorAll('.chips').forEach(group => {
  group.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const kind = group.dataset.group, v = b.dataset.v;
    if (kind === 'acc' || kind === 'cam') {
      const on = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', String(on));
      if (kind === 'cam') controls.autoRotate = on;
      else acc[v].visible = on;
      if (v === 'catears' && on) setFace('cat');
      return;
    }
    if (kind === 'pose') {
      group.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
      state.pose = v; goal = poseAngles(v); bubble.textContent = goal.line;
      if (v === 'reach') setFace('wink'); else if (state.face === 'wink') setFace('smile');
    }
    if (kind === 'face') setFace(v);
  });
});
function setFace(v) {
  state.face = v; drawFace(v);
  document.querySelectorAll('[data-group="face"] button').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.v === v)));
  if (lines[v]) bubble.textContent = lines[v];
}

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h;
  camera.position.setLength(w / h < 0.8 ? 13 : 10.5);
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage); resize();

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
if (reduce) { controls.autoRotate = false; document.getElementById('cam-spin').setAttribute('aria-pressed', 'false'); }
const clock = new THREE.Clock();
let nextBlink = 2.5, blinking = 0;
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  const k = 1 - Math.pow(0.002, dt);
  for (const s of [1, -1]) {
    const a = arms[s], g = goal[s];
    a.shoulder.rotation.x = lerp(a.shoulder.rotation.x, g.sx, k);
    a.shoulder.rotation.z = lerp(a.shoulder.rotation.z, g.sz, k);
    a.elbow.rotation.x = lerp(a.elbow.rotation.x, g.ex, k);
  }
  if (!reduce) {
    torso.position.y = Math.sin(t * 1.6) * 0.012;
    headPivot.rotation.z = lerp(headPivot.rotation.z, goal.tilt + Math.sin(t * 0.9) * 0.035, k);
    headPivot.rotation.x = Math.sin(t * 0.7) * 0.02;
    hair.rotation.z = Math.sin(t * 1.1) * 0.008;
    sparkles.rotation.y = t * 0.05;
    const sp = sparkles.geometry.attributes.position;
    for (let i = 0; i < sp.count; i++) { let y = sp.getY(i) + dt * 0.15; if (y > 5.5) y = 0; sp.setY(i, y); }
    sp.needsUpdate = true;
    if (t > nextBlink && !blinking && state.face !== 'wink' && state.face !== 'cat') { blinking = t; drawFace(state.face, true); }
    if (blinking && t - blinking > 0.12) { blinking = 0; nextBlink = t + 2 + Math.random() * 3; drawFace(state.face); }
  } else headPivot.rotation.z = goal.tilt;
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();

// hooks for offline export (GLB) — not used by the page itself
window.__rin = { THREE, scene, rin, sparkles, M, setFace, setPose: v => { goal = poseAngles(v); for (const s of [1, -1]) { arms[s].shoulder.rotation.set(goal[s].sx, 0, goal[s].sz); arms[s].elbow.rotation.set(goal[s].ex, 0, 0); } }, controls };
</script>
